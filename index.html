<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Haven</title>
  <meta name="description" content="Calm puzzle games. No ads.">
  <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12100e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Haven">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Shippori+Mincho:wght@600;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/words.css">
  <script>
    // Set the theme before first paint so there is no flash.
    (function () {
      try {
        var s = (JSON.parse(localStorage.getItem('haven.v1')) || {}).settings || {};
        var mode = s.mode || 'system';
        if (mode === 'system') mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.mode = mode;
        document.documentElement.dataset.palette = s.palette || 'ivory';
      } catch (e) {
        document.documentElement.dataset.mode = 'light';
        document.documentElement.dataset.palette = 'ivory';
      }
    })();
  </script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <main id="app"></main>
  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
